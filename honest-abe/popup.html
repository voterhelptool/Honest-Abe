<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honest Abe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap');

  :root {
    --ink:      #1a1a2e;
    --parchment:#f5f0e8;
    --gold:     #b8860b;
    --green:    #2e7d32;
    --amber:    #e65100;
    --red:      #c62828;
    --muted:    #6b6b7a;
    --border:   #d4c9b0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 360px;
    min-height: 480px;
    background: var(--parchment);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    font-size: 13px;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: var(--parchment);
    padding: 16px 18px 14px;
    border-bottom: 3px solid var(--gold);
  }
  .abe-logo {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .abe-logo span { color: var(--gold); }
  .abe-tagline {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-top: 3px;
  }

  /* ── CONSTITUTION BAR ── */
  .constitution {
    display: flex;
    gap: 6px;
    padding: 8px 18px;
    background: #111128;
    flex-wrap: wrap;
  }
  .principle {
    font-size: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.7;
  }
  .principle::after { content: "·"; margin-left: 6px; opacity: 0.4; }
  .principle:last-child::after { content: ""; }

  /* ── INPUT AREA ── */
  .input-area {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
  }
  .input-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    height: 72px;
    padding: 10px 12px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'Source Serif 4', serif;
    font-size: 12px;
    color: var(--ink);
    resize: none;
    outline: none;
    line-height: 1.5;
  }
  textarea:focus { border-color: var(--gold); }

  .analyze-btn {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: var(--ink);
    color: var(--parchment);
    border: none;
    border-radius: 4px;
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.2s;
  }
  .analyze-btn:hover   { background: #2a2a4a; }
  .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── PROVIDER STATUS ── */
  .provider-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 18px;
    background: #f0ebe0;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
  }
  .provider-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ccc;
  }
  .provider-dot.active { background: var(--green); }
  .provider-dot.loading { background: var(--gold); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── RESULTS ── */
  .results { padding: 16px 18px; }

  .verdict-box {
    padding: 12px 14px;
    border-radius: 4px;
    border-left: 4px solid;
    margin-bottom: 14px;
  }
  .verdict-box.pass   { background:#e8f5e9; border-color: var(--green); }
  .verdict-box.warn   { background:#fff8e1; border-color: var(--gold); }
  .verdict-box.fail   { background:#fce4ec; border-color: var(--red); }
  .verdict-box.unknown { background:#f5f5f5; border-color: #bbb; }

  .verdict-label {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .verdict-summary { font-size: 11px; line-height: 1.6; opacity: 0.85; }

  /* ── PILLARS ── */
  .pillars-title {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .pillar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 11px;
  }
  .pillar-name { width: 130px; flex-shrink: 0; }
  .pillar-bar-wrap {
    flex: 1;
    height: 6px;
    background: #e0dbd0;
    border-radius: 3px;
    overflow: hidden;
  }
  .pillar-bar {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }
  .pillar-score { width: 30px; text-align: right; font-size: 10px; color: var(--muted); }

  /* ── FLAGS ── */
  .flags { margin-top: 12px; }
  .flag-item {
    display: flex;
    gap: 6px;
    font-size: 10px;
    color: var(--amber);
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .flag-item::before { content: "⚠"; flex-shrink: 0; }

  /* ── INCENTIVE BIAS ── */
  .bias-box {
    margin-top: 10px;
    padding: 8px 10px;
    background: #fff3e0;
    border-radius: 4px;
    font-size: 10px;
    color: #e65100;
    line-height: 1.5;
  }

  /* ── FOOTER ── */
  footer {
    padding: 10px 18px;
    border-top: 1px solid var(--border);
    font-size: 9px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  footer a { color: var(--gold); text-decoration: none; }

  /* ── SETTINGS ── */
  .settings-panel {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    display: none;
  }
  .settings-panel.open { display: block; }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 11px;
  }
  .setting-row input[type="text"] {
    width: 180px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 11px;
    background: white;
  }
  .settings-toggle {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 10px;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0;
  }

  /* ── LOADING STATE ── */
  .loading-state {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
    display: none;
  }
  .loading-state.visible { display: block; }
</style>
</head>
<body>

<header>
  <div class="abe-logo">Honest <span>Abe</span></div>
  <div class="abe-tagline">Free · Fair · Firm · True · Transparent</div>
</header>

<div class="constitution">
  <span class="principle">Free</span>
  <span class="principle">Fair</span>
  <span class="principle">Firm</span>
  <span class="principle">Fun</span>
  <span class="principle">True</span>
  <span class="principle">Transparent</span>
  <span class="principle">Accessible</span>
</div>

<div class="input-area">
  <div class="input-label">Submit a claim for analysis</div>
  <textarea id="claimInput" placeholder="Paste or type any claim, headline, or statement…"></textarea>
  <button class="analyze-btn" id="analyzeBtn">Analyze</button>
</div>

<div class="provider-bar">
  <div class="provider-dot" id="providerDot"></div>
  <span id="providerLabel">Ready</span>
</div>

<div class="loading-state" id="loadingState">
  Abe is thinking…
</div>

<div class="results" id="results" style="display:none">

  <div class="verdict-box" id="verdictBox">
    <div class="verdict-label" id="verdictLabel"></div>
    <div class="verdict-summary" id="verdictSummary"></div>
  </div>

  <div class="pillars-title">Four Pillars of Truth</div>

  <div class="pillar-row">
    <span class="pillar-name">Verifiable</span>
    <div class="pillar-bar-wrap"><div class="pillar-bar" id="barV"></div></div>
    <span class="pillar-score" id="scoreV"></span>
  </div>
  <div class="pillar-row">
    <span class="pillar-name">Reproducible</span>
    <div class="pillar-bar-wrap"><div class="pillar-bar" id="barR"></div></div>
    <span class="pillar-score" id="scoreR"></span>
  </div>
  <div class="pillar-row">
    <span class="pillar-name">Contextually Honest</span>
    <div class="pillar-bar-wrap"><div class="pillar-bar" id="barCH"></div></div>
    <span class="pillar-score" id="scoreCH"></span>
  </div>
  <div class="pillar-row">
    <span class="pillar-name">Falsifiable</span>
    <div class="pillar-bar-wrap"><div class="pillar-bar" id="barF"></div></div>
    <span class="pillar-score" id="scoreF"></span>
  </div>

  <div class="flags" id="flagsBox"></div>
  <div class="bias-box" id="biasBox" style="display:none"></div>

</div>

<footer>
  <span>Always verify with primary sources.</span>
  <button class="settings-toggle" id="settingsToggle">⚙ Keys</button>
</footer>

<div class="settings-panel" id="settingsPanel">
  <div class="setting-row">
    <span>HuggingFace Token</span>
    <input type="text" id="hfToken" placeholder="hf_…">
  </div>
  <div class="setting-row">
    <span>Mistral Key</span>
    <input type="text" id="mistralKey" placeholder="…">
  </div>
  <div class="setting-row">
    <button class="analyze-btn" id="saveKeys" style="margin:0;padding:6px">Save</button>
  </div>
</div>

<script src="ethics.js"></script>
<script src="truth-model.js"></script>
<script src="hallucination-guard.js"></script>
<script src="nlp.js"></script>
<script src="agent.js"></script>
<script src="popup.js"></script>
</body>
</html>
